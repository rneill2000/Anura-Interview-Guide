{% extends "base.html" %}
{% block title %}Sign In{% endblock %}

{% block content %}
<div class="flex justify-center items-center py-16">
    <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-10 max-w-sm w-full">
        <h1 class="text-xl font-bold text-anura-950 mb-1 text-center">Interview Guide Generator</h1>
        <p class="text-gray-400 text-sm mb-8 text-center">Sign in to continue</p>

        {% if form.errors %}
        <div class="bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg px-4 py-3 mb-5">
            Incorrect username or password.
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next|default:'/' }}">
            <div class="mb-4">
                <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" name="username" id="id_username" autofocus autocapitalize="none"
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-anura-100 focus:border-anura-500 outline-none transition">
            </div>
            <div class="mb-6">
                <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" name="password" id="id_password"
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-anura-100 focus:border-anura-500 outline-none transition">
            </div>
            <button type="submit"
                    class="w-full px-6 py-3 bg-anura-500 hover:bg-anura-600 text-white font-semibold rounded-lg text-sm transition-all duration-200 shadow-sm hover:shadow">
                Sign In
            </button>
        </form>
    </div>
</div>
{% endblock %}
